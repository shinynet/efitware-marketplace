name: Verify marketplace
on: [push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Verify deterministic card
        run: |
          sha256sum dist/card/workout.html > "$RUNNER_TEMP/card.sha256"
          pnpm build
          sha256sum --check "$RUNNER_TEMP/card.sha256"
