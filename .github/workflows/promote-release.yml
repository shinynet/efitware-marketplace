name: Promote verified immutable release
on:
  push:
    branches: [main]
    paths: [channels.json, .github/release-promotion.json, scripts/promote-release.ts, .github/workflows/promote-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-release-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify immutable assets and publish release metadata
        if: ${{ hashFiles('.github/release-promotion.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-release.ts
